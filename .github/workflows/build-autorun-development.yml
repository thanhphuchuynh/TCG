name: Build Autorun development runtime

on:
  workflow_dispatch:
  push:
    branches: [build/switch-compat-nsp]
    paths: [.github/workflows/build-autorun-development.yml]

permissions:
  contents: read

jobs:
  runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Install host build tools
        run: sudo apt-get update && sudo apt-get install -y bison flex cmake ninja-build build-essential gettext pkg-config
      - name: Fetch pinned upstream source
        run: |
          git clone --filter=blob:none --no-checkout https://github.com/autorunhq/autorun.git upstream
          git -C upstream checkout 1ac9b6cf37b90f2d5783dd7ef389bebbe1c68877
          git -C upstream submodule update --init horizon-dlls
      - name: Install upstream Windows cross compiler
        run: |
          curl --fail --location --retry 3 -o llvm-mingw.tar.xz https://github.com/mstorsjo/llvm-mingw/releases/download/20260505/llvm-mingw-20260505-ucrt-ubuntu-22.04-x86_64.tar.xz
          mkdir toolchain
          tar -xJf llvm-mingw.tar.xz -C toolchain --strip-components=1
          echo "$PWD/toolchain/bin" >> "$GITHUB_PATH"
      - name: Configure Wine and generate headers
        working-directory: upstream
        run: |
          mkdir -p horizon-wine/build-wine-amd64-pe
          cd horizon-wine/build-wine-amd64-pe
          ../../configure --enable-archs=aarch64,arm64ec,i386 --enable-winebox64=aarch64 --enable-winebox64ec=arm64ec --disable-tests --without-x --without-freetype --without-alsa --without-pulse --without-dbus --without-fontconfig --without-udev --without-usb --without-gstreamer --enable-winegstreamer --without-vulkan
          make -j2 include/all
      - name: Prepare upstream translator and codecs
        working-directory: upstream
        run: |
          sh horizon-wine/tools/bootstrap-box64-core.sh
          sh horizon-wine/tools/bootstrap-wma.sh
      - name: Build FEX runtime with upstream SDK
        working-directory: upstream
        run: |
          docker pull ghcr.io/autorunhq/switch-dev:2026.10.01
          docker run --rm --network none -v "$PWD:/work" -w /work ghcr.io/autorunhq/switch-dev:2026.10.01 sh -ec '
            git config --global --add safe.directory /work/horizon-wine/vendor/box64
            cmake -S horizon-wine -B horizon-wine/build-switch-amd64-fex -G Ninja -DCMAKE_TOOLCHAIN_FILE=/work/horizon-wine/cmake/switch-devkitA64.cmake -DWINE_NX_PE_BUILD_DIR=/work/horizon-wine/build-wine-amd64-pe -DWINE_NX_AMD64=ON -DWINE_NX_FEX=ON -DWINE_NX_BOX64_INTERPRETER=ON -DWINE_NX_BOX64_DYNAREC=ON -DWINE_NX_USB_STORAGE=ON -DCMAKE_BUILD_TYPE=Release
            cmake --build horizon-wine/build-switch-amd64-fex --target wine-nx-runtime-nro -j2
          '
      - name: Save build provenance
        working-directory: upstream
        run: |
          mkdir -p development-artifact
          git rev-parse HEAD > development-artifact/upstream-commit.txt
          git submodule status > development-artifact/submodule-commits.txt
          docker image inspect ghcr.io/autorunhq/switch-dev:2026.10.01 --format '{{index .RepoDigests 0}}' > development-artifact/sdk-image-digest.txt
          find horizon-wine/build-switch-amd64-fex -type f \( -name '*.nro' -o -name '*.elf' \) -exec cp {} development-artifact/ \;
          sha256sum development-artifact/* > development-artifact/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: autorun-development-fex
          path: upstream/development-artifact/
          if-no-files-found: error
          retention-days: 7
